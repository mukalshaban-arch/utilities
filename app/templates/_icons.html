{# Inline stroke icons (no icon-font dependency). Usage: {{ icon('dashboard') }} #}
{% macro icon(name) %}
<svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'menu' %}
  <path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == 'dashboard' %}
  <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
  <rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>
{%- elif name == 'beneficiaries' %}
  <circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.4 5.5-5.4s5.5 2.1 5.5 5.4"/>
  <path d="M16 5.2a3 3 0 0 1 0 5.8"/><path d="M18.5 20c0-2.2-.8-3.9-2.1-5"/>
{%- elif name == 'summary' %}
  <circle cx="12" cy="12" r="9"/><path d="M12 12V3"/><path d="M12 12l7.2 4.2"/>
{%- elif name == 'major' %}
  <rect x="4" y="3" width="10" height="18" rx="1"/><path d="M14 8h6v13h-6"/>
  <path d="M7 7h1M11 7h1M7 11h1M11 11h1M7 15h1M11 15h1M17 12h1M17 16h1"/>
{%- elif name == 'reports' %}
  <path d="M6 2.5h8l4 4V21.5H6z"/><path d="M14 2.5v4h4"/><path d="M9 13h6M9 16.5h6"/>
{%- elif name == 'activity' %}
  <path d="M3 12h4l3 8 4-16 3 8h4"/>
{%- elif name == 'logins' %}
  <path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M12 11v3"/><circle cx="12" cy="9.5" r="1"/>
{%- elif name == 'password' %}
  <circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M17 5l2 2M15 7l2 2"/>
{%- elif name == 'backups' %}
  <ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3 3 7 3s7-1.3 7-3V6"/>
  <path d="M5 12c0 1.7 3 3 7 3s7-1.3 7-3"/>
{%- elif name == 'user-plus' %}
  <circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.3 2.7-6 6-6"/><path d="M17 8v6M14 11h6"/>
{%- elif name == 'utility' %}
  <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
{%- elif name == 'logout' %}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'plus' %}
  <path d="M12 5v14M5 12h14"/>
{%- endif %}
</svg>
{% endmacro %}
