# SonarCloud project configuration.
# sonar.organization and sonar.projectKey must match exactly what SonarCloud
# assigned when you imported this repo at https://sonarcloud.io/projects/create
# (Project Settings -> General Settings shows the exact values). Update the two
# lines below if they don't match.
sonar.organization=mukalshaban-arch
sonar.projectKey=mukalshaban-arch_utilities

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.11

# Coverage report produced by `pytest --cov-report=xml` in the CI workflow.
sonar.python.coverage.reportPaths=coverage.xml

# Generated code, vendored assets, and migration scaffolding aren't hand-written
# logic - excluding them keeps the quality gate focused on code we actually wrote.
sonar.exclusions=app/static/chart.umd.min.js,migrations/**
